<!DOCTYPE html>
<html class="no-js" lang="es-mx">

<head>
   <meta charset="utf-8" />
   <meta http-equiv="x-ua-compatible" content="ie=edge" />
   <title>Clientes</title>
   <meta name="viewport" content="width=device-width, initial-scale=1" />
   <link rel="shortcut icon" type="image/png"
      href="{{ url_for('static',filename='assets/images/icon/favicon.ico') }}" />
   <link rel="stylesheet" href="{{ url_for('static',filename='assets/css/bootstrap.min.css') }}" />
   <link rel="stylesheet" href="{{ url_for('static',filename='assets/css/metisMenu.css') }}" />
   <link rel="stylesheet" href="{{ url_for('static',filename='assets/css/slicknav.min.css') }}" />
   <link rel="stylesheet" href="{{ url_for('static',filename='assets/css/export.css') }}" type="text/css" media="all" />
   <link rel="stylesheet" href="{{ url_for('static',filename='assets/css/typography.css') }}" />
   <link rel="stylesheet" href="{{ url_for('static',filename='assets/css/default-css.css') }}" />
   <link rel="stylesheet" href="{{ url_for('static',filename='assets/css/styles.css') }}" />
   <link rel="stylesheet" href="{{ url_for('static',filename='assets/css/responsive.css') }}" />
   <link rel="stylesheet" href="{{ url_for('static',filename='assets/css/brc-styles.css') }}" />
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/simplePagination.js/1.6/simplePagination.min.css">
</head>

<body>
   <nav class="navbar">
      <a class="app-section" href="{{ url_for('main.index') }}">
         <h2 class="name-app">Póliza Tracker</h2>
         <img src="{{ url_for('static',filename='assets/images/GGGC.png') }}" class="logo-ggc" />
      </a>
      <div class="user-profile pull-right">
         <h6 class="user-name dropdown-toggle" data-toggle="dropdown">
            {{ current_user.username }}<i class="fa fa-angle-down"></i>
         </h6>
         <div class="dropdown-menu">
            <a class="dropdown-item" href="{{ url_for('auth.logout') }}">Cerrar Sesión</a>
            <a class="dropdown-item" href="{{ url_for('auth.cambiar_contrasena') }}">Cambiar Contraseña</a>
         </div>
      </div>
   </nav>

   <!-- page container area start -->
   <div class="container-fluid">
      <div class="row mt-3">
         <div class="col-3 p-3">
            <div class="w-100 card__shadow p-3">
               <h4 class="header-title">Captura de Clientes</h4>
               <form id="cliente-form"class="needs-validation form-data" novalidate>
                  <input type="hidden" id="cliente_id" name="cliente_id" value="New" />
                  <div class="form__input-data">
                     <label for="nombre" class="label-input-data">
                        Nombre Cliente
                     </label>
                     <div class="input-group">
                        <input type="text" class="form-control" id="nombre" name="nombre" placeholder="" minlength="2"
                           maxlength="50" required />
                        <p class="invalid-feedback">Ingresa un nombre válido.</p>
                     </div>
                  </div>
                  <div class="form__input-data">
                     <label for="apellido" class="label-input-data">Apellido</label>
                     <div class="input-group">
                        <input type="text" class="form-control" id="apellido" name="apellido" placeholder="" minlength="2"
                           maxlength="50" required />
                        <p class="invalid-feedback">Ingresa un apellido válido.</p>
                     </div>
                  </div>
                  <div class="form__input-data">
                     <label for="rfc" class="label-input-data">RFC</label>
                     <div class="input-group">
                        <input type="text" class="form-control" id="rfc" name="rfc" placeholder="" minlength="12"
                           maxlength="13" required />
                        <p class="invalid-feedback">Ingresa un RFC válido.</p>
                     </div>
                  </div>
                  <div class="form__input-data">
                     <label for="telefono_movil" class="label-input-data">Teléfonos Móviles</label>
                     <div class="input-group">
                        <input type="text" class="form-control" id="telefono_movil" name="telefono_movil" placeholder="" minlength="10" maxlength="10" />
                     </div>
                  </div>
                  <div class="form__input-data">
                     <label class="label-input-data" for="correo">Correo Electrónico</label>
                     <div class="input-group">
                        <input type="email" class="form-control" id="correo" name="correo" placeholder="" minlength="5" maxlength="50" />
                     </div>
                  </div>
                  <div class="form__input-data">
                     <label for="direccion_fiscal" class="label-input-data">Dirección Fiscal</label>
                     <div class="input-group">
                        <input type="text" class="form-control" id="direccion_fiscal" name="direccion_fiscal" placeholder="" minlength="5" maxlength="125" />
                     </div>
                  </div>
                  <div class="input-sibling">
                     <div class="form__input-data input-sibling-child">
                        <label for="fecha_nacimiento" class="label-input-data">Fecha de Nacimiento</label>
                        <div class="input-group">
                           <input type="date" class="form-control" id="fecha_nacimiento" name="fecha_nacimiento"
                              placeholder=""/>
                        </div>
                     </div>
                     <div class="form__input-data input-sibling-child">
                        <label for="sexo" class="label-input-data">Sexo</label>
                        <select class="custom-select" id="sexo" name="sexo">
                           <option value="">Selecciona...</option>
                           <option value="Mujer">Mujer</option>
                           <option value="Hombre">Hombre</option>
                           <option value="Empresa">Empresa</option>
                        </select>
                     </div>
                  </div>
                  <div class="input-sibling">
                     <div class="form__input-data input-sibling-child">
                        <label for="ocupacion" class="label-input-data">Ocupación</label>
                        <div class="input-group">
                           <input type="text" class="form-control" id="ocupacion" name="ocupacion" placeholder=""
                              minlength="2" maxlength="30"/>
                        </div>
                     </div>
                     <div class="form__input-data input-sibling-child">
                        <label for="giro_actividad" class="label-input-data">Giro o Actividad</label>
                        <div class="input-group">
                           <input type="text" class="form-control" id="giro_actividad" name="giro_actividad" placeholder="" minlength="2" maxlength="30"/>
                        </div>
                     </div>
                  </div>
                  <div class="form__input-data">
                     <label for="grupo" class="label-input-data">Grupo</label>
                     <select class="custom-select" id="grupo" name="grupo" required>
                        <option value="">Selecciona...</option>
                        {% for grupo in grupos %}
                        <option value="{{ grupo.id }}">{{ grupo.grupo }}</option>
                        {% endfor %}
                        <option value="New">Nuevo Grupo</option>
                     </select>
                     <p class="invalid-feedback">Selecciona un grupo válido.</p>
                  </div>
                  <div class="form__input-data" style="display: none" id="nuevo_grupo_div">
                     <label for="nuevo_grupo" class="label-input-data">Nuevo Grupo</label>
                     <div class="input-group">
                        <input type="text" class="form-control" name="nuevo_grupo" id="nuevo_grupo" placeholder=""
                           minlength="2" maxlength="30" />
                        <p class="invalid-feedback">Ingresa un nuevo grupo</p>
                     </div>
                  </div>
                  <div class="form__input-data">
                     <label for="notas" class="label-input-data">Notas</label>
                     <div class="input-group">
                        <input type="text" class="form-control" id="notas" name="notas" placeholder="" minlength="5"
                           maxlength="125" />
                     </div>
                  </div>
                  <div class="form__input-data">
                     <label for="cuenta" class="label-input-data">
                        Número de Cuenta/Tarjeta
                     </label>
                     <div class="input-group">
                        <input type="tel" inputmode="numeric" pattern="[0-9\s]{16,18}" autocomplete="cc-number" maxlength="19"
                           class="form-control" id="cuenta" name="cuenta" placeholder="xxxx xxxx xxxx xxxx"/>
                     </div>
                  </div>
                  <div class="input-sibling">
                     <div class="form__input-data input-sibling-child">
                        <label for="fecha_vencimiento" class="label-input-data">Fecha vencimiento</label>
                        <div class="input-group">
                           <input type="text" class="form-control" id="fecha_vencimiento" name="fecha_vencimiento" placeholder="" minlength="5" maxlength="5" />
                        </div>
                     </div>
                     <div class="form__input-data input-sibling-child">
                        <label for="cvv" class="label-input-data">Cvv</label>
                        <div class="input-group">
                           <input type="text" class="form-control" id="cvv" name="cvv" placeholder="" minlength="3" maxlength="3" />
                        </div>
                     </div>
                  </div>
                  <div class="button-container">
                     <button id="Savebtn" type="submit" class="btn">
                        Crear
                     </button>
                     <button id="Resetbtn" type="reset" class="btn">
                        Cancelar
                     </button>
                  </div>
               </form>
            </div>
         </div>
         <div class="col-9 p-3">
            <div class="w-100 card__shadow p-3">
               <div class="table-polizas" id="table-polizas">
                  <h4 class="header-title">Tabla de Clientes</h4>
                  <form class="d-flex" role="search">
                     <input class="form-control my-2" type="search" placeholder="Buscar Cliente" aria-label="Search"
                        id="searchClient" />
                  </form>
                  <table class="table pb-5">
                     <thead class="tableHeader">
                        <tr>
                           <th class="table-name siblingContainerRow" scope="col">
                              Nombre
                              <a class="btn__icon" id="sortByName">
                                 <svg xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 -960 960 960" width="24">
                                    <path
                                       d="m80-280 162-400h63l161 400h-63l-38-99H181l-38 99H80Zm121-151h144l-70-185h-4l-70 185Zm347 151v-62l233-286H566v-52h272v63L607-332h233v52H548ZM384-784l96-96 96 96H384Zm96 704-96-96h192l-96 96Z" />
                                 </svg>
                              </a>
                           </th>
                           <th class="table-mail" scope="col">
                              Correo
                           </th>
                           <th class="table-phone" scope="col">
                              Celular
                           </th>
                           <th class="table-actions" scope="col">
                              Acción
                           </th>
                           <!-- <th scope="col">Vigencia</th> -->
                           <!-- <th scope="col"></th> -->
                        </tr>
                     </thead>
                     <tbody id="table-clientes" class="pb-5">
                        <!-- Agregar la información de la tabla -->
                     </tbody>
                  </table>
               </div>
               <div class="w-100 d-flex justify-content-center">
                  <div id="pagination" style="position: absolute;bottom: 15px;"></div>
               </div>
            </div>
         </div>
      </div>
   </div>

   <script type="module" src="{{ url_for('static', filename='assets/controladores/clientes.js') }}"></script>
   <script src="{{ url_for('static', filename='assets/js/vendor/jquery-2.2.4.min.js') }}"></script>
   <script src="{{ url_for('static', filename='assets/js/jquery.slimscroll.min.js') }}"></script>
   <script src="{{ url_for('static', filename='assets/js/jquery.slicknav.min.js') }}"></script>
   <script src="{{ url_for('static', filename='assets/js/owl.carousel.min.js') }}"></script>
   <script src="{{ url_for('static', filename='assets/js/popper.min.js') }}"></script>
   <script src="{{ url_for('static', filename='assets/js/bootstrap.min.js') }}"></script>
   <script src="{{ url_for('static', filename='assets/js/metisMenu.min.js') }}"></script>
   <script src="{{ url_for('static',filename='assets/js/vendor/modernizr-2.8.3.min.js') }}"></script>
   <script src="{{ url_for('static', filename='assets/js/sweetalert.js') }}"></script>
   <script src="{{ url_for('static', filename='assets/js/plugins.js') }}"></script>
   <script src="{{ url_for('static', filename='assets/js/scripts.js') }}"></script>
   <script src="https://cdnjs.cloudflare.com/ajax/libs/simplePagination.js/1.6/jquery.simplePagination.min.js"></script>
</body>
</html>
