<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Restablecer contraseña — Portal del Asegurado</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
  :root {
    --color-primario: #c94a1c;
    --gris-medio: #6c757da9;
  }
  body {
    background-color: #e9e9e9; min-height: 100vh;
    display: flex; align-items: center; justify-content: center; padding: 40px 20px;
  }
  .auth-card {
    background: white; border-radius: 14px; box-shadow: 5px 2px 14px -9px var(--gris-medio);
    width: 100%; max-width: 420px; padding: 40px 36px;
  }
  .auth-logo { display: flex; justify-content: center; margin-bottom: 20px; }
  .auth-logo img { height: 64px; }
  .auth-title { font-size: 20px; font-weight: 600; color: #2b2b2b; text-align: center; margin-bottom: 4px; }
  .auth-subtitle { font-size: 13px; color: var(--gris-medio); text-align: center; margin-bottom: 28px; line-height: 1.5; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 12px; color: #6c757d; margin-bottom: 5px; font-weight: 500; }
  .field input {
    width: 100%; border: 1.5px solid #e2e2e2; border-radius: 8px;
    padding: 11px 13px; font-size: 14px; background: #fafafa;
  }
  .field input:focus { outline: none; border-color: var(--color-primario); background: white; }
  .btn-primary {
    width: 100%; background: var(--color-primario); color: white; border: none;
    padding: 13px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 6px;
  }
  .btn-primary:hover { filter: brightness(0.92); }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
  .btn-link {
    display: block; text-align: center; color: var(--gris-medio); font-size: 13px;
    margin-top: 16px; text-decoration: none; cursor: pointer; background: none; border: none; width: 100%;
  }
  .modal-icon {
    width: 56px; height: 56px; border-radius: 50%; background: #fff4e5; color: #d68a1a;
    display: flex; align-items: center; justify-content: center; font-size: 28px; margin: 0 auto 16px;
  }
  .alerta {
    border-radius: 8px; padding: 10px 12px; font-size: 12.5px; margin-bottom: 18px; line-height: 1.5; display: none;
  }
  .alerta.error { background: #fdeeee; border: 1px solid #f3c8c8; color: #a83232; }
  .alerta.active { display: block; }
</style>
</head>
<body>

{% if token_valido %}
  <div class="auth-card" id="cardFormulario">
    <div class="auth-logo"><img src="{{ url_for('static', filename='assets/images/GGGC.png') }}" alt="GGcorp" /></div>
    <div class="auth-title">Restablece tu contraseña</div>
    <div class="auth-subtitle">Elige una nueva contraseña para tu cuenta.</div>

    <div class="alerta error" id="errorMsg"></div>

    <form id="formRestablecer">
      <div class="field">
        <label>Nueva contraseña</label>
        <input type="password" id="nuevaPassword" required placeholder="Mínimo 8 caracteres" />
      </div>
      <div class="field">
        <label>Confirmar contraseña</label>
        <input type="password" id="confirmarPassword" required placeholder="••••••••" />
      </div>
      <button class="btn-primary" type="submit" id="btnSubmit">Guardar contraseña</button>
    </form>
  </div>
{% else %}
  <div class="auth-card">
    <div class="auth-logo"><img src="{{ url_for('static', filename='assets/images/GGGC.png') }}" alt="GGcorp" /></div>
    <div class="modal-icon">!</div>
    <div class="auth-title">Este link ya no es válido</div>
    <div class="auth-subtitle">{{ error or 'Por seguridad, los links de recuperación solo son válidos por un tiempo limitado.' }}</div>
    <a href="{{ url_for('portal.login_page') }}" class="btn-primary" style="display:block; text-align:center; text-decoration:none; box-sizing:border-box;">Volver a iniciar sesión</a>
  </div>
{% endif %}

<script>
  const formRestablecer = document.getElementById('formRestablecer');
  if (formRestablecer) {
    formRestablecer.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnSubmit');
      const errorEl = document.getElementById('errorMsg');
      errorEl.classList.remove('active');

      const password = document.getElementById('nuevaPassword').value;
      const confirmar = document.getElementById('confirmarPassword').value;

      btn.disabled = true;
      const params = new URLSearchParams();
      params.append('token', '{{ token }}');
      params.append('password', password);
      params.append('confirmar_password', confirmar);

      try {
        const resp = await fetch('{{ url_for("portal.api_restablecer_password") }}', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: params,
        });
        const data = await resp.json();
        if (data.error) {
          errorEl.textContent = data.msg;
          errorEl.classList.add('active');
        } else {
          alert('Contraseña actualizada. Ya puedes iniciar sesión.');
          window.location.href = data.redirect;
        }
      } catch (err) {
        errorEl.textContent = 'Ocurrió un error, intenta de nuevo.';
        errorEl.classList.add('active');
      } finally {
        btn.disabled = false;
      }
    });
  }
</script>
</body>
</html>
