<!-- Modal: generar / regenerar recibos de Chubb desde sus avisos de cobro.
     Lo maneja static/assets/controladores/chubb_avisos.js -->
<div class="modal fade bd-example-modal-lg" id="chubb-avisos-modal" tabindex="-1" role="dialog" aria-hidden="true" style="z-index: 1055;">
   <div class="modal-dialog modal-lg modal-dialog-centered" role="document" style="max-width: 1000px;">
      <div class="modal-content">
         <div class="modal-header">
            <h5 class="modal-title" id="chubb-m-titulo">Recibos desde avisos de cobro</h5>
            <button type="button" class="close" data-dismiss="modal" aria-label="Close">
               <span aria-hidden="true">&times;</span>
            </button>
         </div>
         <div class="modal-body">
            <p class="text-muted mb-3" id="chubb-m-ayuda" style="font-size: 13px;"></p>
            <div class="form-group mb-2">
               <label class="mb-1">Avisos de cobro de Chubb (PDF)</label>
               <input type="file" class="form-control-file" id="chubb-m-files" accept="application/pdf,.pdf" multiple />
               <small class="text-muted">Puedes elegir un PDF con todos los avisos, varios PDF (uno por aviso) o el PDF de la póliza si trae todos los avisos.</small>
            </div>
            <div class="form-group mb-2" style="max-width: 220px;">
               <label class="mb-1">% comisión</label>
               <input type="text" class="form-control" id="chubb-m-comision" inputmode="decimal" />
            </div>
            <div class="mb-3">
               <button type="button" class="btn btn-sm" id="chubb-m-leer">Leer avisos</button>
            </div>
            <div id="chubb-m-preview"></div>
         </div>
         <div class="modal-footer">
            <button type="button" class="btn btn-default" data-dismiss="modal">Cancelar</button>
            <button type="button" class="btn" id="chubb-m-confirmar" disabled>Generar recibos</button>
         </div>
      </div>
   </div>
</div>
