<!doctype html>
<html class="no-js" lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="shortcut icon" type="image/png" href="assets/images/icon/favicon.ico">
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/font-awesome.min.css">
    <link rel="stylesheet" href="assets/css/themify-icons.css">
    <link rel="stylesheet" href="assets/css/metisMenu.css">
    <link rel="stylesheet" href="assets/css/owl.carousel.min.css">
    <link rel="stylesheet" href="assets/css/slicknav.min.css">
    <!-- amchart css -->
    <link rel="stylesheet" href="https://www.amcharts.com/lib/3/plugins/export/export.css" type="text/css"
        media="all" />
    <!-- others css -->
    <link rel="stylesheet" href="assets/css/typography.css">
    <link rel="stylesheet" href="assets/css/default-css.css">
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
    <!-- modernizr css -->
    <script src="assets/js/vendor/modernizr-2.8.3.min.js"></script>
    <!-- Incluye SweetAlert mediante CDN en tu archivo HTML -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>

    <div class="header">
        <div id="preloader">

            <div class="loader"></div>
        </div>

        <div class="login-area login-s1">
            <div class="container">

                <div class="login-box 15px">
                    <!--<img src="assets/images/estasi.png" width="600" height="1400"/>-->
                    <!-- <img src="assets/images/GGGC.png" width="600" height="200" /> -->
                    <form id="loginform">

                        <div class="login-form-head">
                            <b>
                                <h4>¡Bienvenido!</h4>
                            </b>
                            <h6 class="text-white">¿Listo para el control seguro de tus pólizas?</h6>
                        </div>

                        <div class="login-form-body">
                            <div class="form-gp">
                                <label for="exampleInputEmail1">Usuario</label>
                                <input type="text" id="usuarioAutent">
                                <i class="ti-user"></i>
                                <div class="text-danger"></div>
                                <div class="invalid-feedback">
                                    Ingresa un usuario valido
                                </div>
                            </div>
                            <div class="form-gp">
                                <label for="exampleInputPassword1">Contraseña</label>
                                <input type="password" id="passwordAutent">
                                <i class="ti-lock"></i>
                                <div class="text-danger"></div>
                                <div class="invalid-feedback">
                                    Ingresa un usuario valido
                                </div>
                            </div>
                            <div class="row mb-4 rmber-area">
                                <div class="col-6">
                                    <div class="custom-control custom-checkbox mr-sm-2">
                                        <input type="checkbox" class="custom-control-input"
                                            id="customControlAutosizing">

                                    </div>
                                </div>
                                <h6 id="mensajeError" role="alert" style="display: none; color: tomato;">Usuario o contraseña invalidos</h6>

                                <div class="col-12 text-right">
                                    <a href="forgotpass.html">¿Olvidaste la contraseña?</a>
                                </div>
                            </div>
                            <div class="submit-btn-area">
                                <a href="modal.html">
                                    <button id="paglog" class="badge-danger btn-sm"
                                        onclick="validarFormulario()">Iniciar Sesión</button>
                                     </a>

                            </div>

                        </div>
                    </form>
                </div>
            </div>
        </div>


        <!-- login area end -->

        <!-- jquery latest version -->
        <script src="assets/js/vendor/jquery-2.2.4.min.js"></script>
        <!-- bootstrap 4 js -->
        <script src="assets/js/popper.min.js"></script>
        <script src="assets/js/bootstrap.min.js"></script>
        <script src="assets/js/owl.carousel.min.js"></script>
        <script src="assets/js/metisMenu.min.js"></script>
        <script src="assets/js/jquery.slimscroll.min.js"></script>
        <script src="assets/js/jquery.slicknav.min.js"></script>

        <!-- others plugins -->
        <script src="assets/js/plugins.js"></script>
        <script src="assets/js/scripts.js"></script>
        <script src="assets/controladores/login2.js"></script>
    </div>
</body>

</html>
