<!-- app/templates/ver_solicitudes.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ver solicitudes</title>
</head>
<body>
    <h1>Solicitudes</h1>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <ul>
                {% for message in messages %}
                    <li>{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}
    {% endwith %}

    <table border="1">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Status</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            {% for nombre,solicitud in resumen %}
                <tr>
                    <td>{{ nombre }}</td>
                    <td>{{ solicitud.status }}</td>
                    <td>
                        <a href="{{ url_for('main.editar_usuario', id=solicitud.usuario_id) }}">Resolver</a>
                    </td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
