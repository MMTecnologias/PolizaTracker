<!-- app/templates/crear_usuario.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Usuario</title>
</head>
<body>
    <h1>Crear Usuario</h1>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <ul>
                {% for message in messages %}
                    <li>{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}
    {% endwith %}

    <form method="POST" action="">
        {{ form.hidden_tag() }}
        <label for="username">Nombre de Usuario:</label>
        {{ form.username() }}
        <br>
        <label for="password">Contraseña:</label>
        {{ form.password() }}
        <br>
        <label for="nivel_id">Nivel de Acceso:</label>
        {{ form.nivel_id() }}
        <br>
        {{ form.submit() }}
    </form>
</body>
</html>
